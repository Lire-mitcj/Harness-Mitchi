[project]
name = "mitkii"
version = "0.1.0"
description = "AI Code Agent with Harness Engine — 终端驱动的智能编码代理"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "csh" },
]
keywords = ["ai", "agent", "coding", "cli", "llm"]

dependencies = [
    "litellm>=1.40.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",
    "tiktoken>=0.7.0",
    "tree-sitter>=0.22.0",
    "aiosqlite>=0.20.0",
    "gitpython>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "sqlparse>=0.5.0",
    "sqlglot>=25.0.0",
    "jieba>=0.42.1",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
mitkii = "src.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/", "prompts/"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
